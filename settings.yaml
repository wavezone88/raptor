# tradebot settings. Secrets live in .env, never here.
# Every risk rule below is enforced in risk.py and covered by a test in
# tests/test_risk.py. Changing a number here changes bot behaviour; removing a
# rule from risk.py makes its test fail.

universe:
  # Editable. Symbols are Alpaca-format (Berkshire class B is "BRK.B").
  etfs: [SPY, QQQ, IWM]
  # 20 largest S&P 500 constituents by market cap. This is a point-in-time
  # snapshot taken when the project was scaffolded, NOT a live index feed —
  # re-check it periodically or the universe will drift from reality.
  equities:
    - NVDA
    - MSFT
    - AAPL
    - AMZN
    - GOOGL
    - META
    - AVGO
    - TSLA
    - BRK.B
    - JPM
    - WMT
    - LLY
    - ORCL
    - V
    - MA
    - NFLX
    - XOM
    - COST
    - JNJ
    - HD
  # Used for the relative-strength ranking. Always fetched even if not traded.
  benchmark: SPY

strategy:
  trend_sma_days: 20            # close must be above this SMA (trend filter)
  pullback_lookback_days: 5     # "5-day high" window
  pullback_min_pct: 0.02        # entry band: 2%..4% below the 5-day high
  pullback_max_pct: 0.04
  volume_avg_days: 10           # today's volume must exceed this average
  volume_multiple: 1.0
  rel_strength_lookback_days: 63  # ~3 months of trading days, for ranking
  stop_pct: 0.04                # exit: -4% from entry
  target_pct: 0.08              # exit: +8% from entry
  time_stop_days: 5             # exit: after 5 trading days held

risk:
  starting_capital: 50.0        # reference equity; live equity comes from Alpaca
  max_open_positions: 3
  max_position_pct_equity: 0.40 # no single position over 40% of equity
  risk_per_trade_pct: 0.01      # size = (equity * 1%) / stop_distance_pct
  stop_distance_pct: 0.04
  daily_loss_limit_pct: 0.05    # -5% from session open -> flatten, halt to next session
  weekly_loss_limit_pct: 0.10   # -10% from Monday open -> flatten, halt to next Monday
  max_day_trades_in_5_business_days: 3  # refuse any order creating a 4th round trip
  min_avg_volume_30d: 5000000   # liquidity floor
  min_price: 10.0               # price floor
  fractional_qty_decimals: 6    # rounding precision for fractional shares

execution:
  entry_limit_buffer_pct: 0.001 # entry limit = ask * (1 + buffer)
  cancel_unfilled_after_cycles: 2
  # Alpaca rejects bracket orders for fractional quantities. When a risk-sized
  # position is under one whole share we cannot attach an exchange-resident
  # stop, so this decides what happens:
  #   reject                 -> refuse the trade (safest; at $50 equity this
  #                             means the bot will almost never trade)
  #   allow_bot_managed_stop -> place a plain notional entry and enforce the
  #                             stop from run_cycle(). THE STOP DIES WITH THE
  #                             PROCESS. See README "Fractional shares".
  fractional_policy: allow_bot_managed_stop

schedule:
  interval_minutes: 15          # run_cycle() cadence during market hours
  pre_close_cancel_minutes: 5   # cancel unfilled entries this long before close
  timezone: America/New_York    # for scheduling only; halts use Alpaca's clock

data:
  cache_dir: data_cache
  bar_timeframe: 1Day
  # A bar older than interval_minutes * this multiple is stale -> cycle no-ops.
  stale_bar_interval_multiple: 2.0

alerts:
  channel: discord
  # Suppress duplicate identical alerts within this window (seconds).
  dedupe_window_seconds: 300

backtest:
  years: 2
  cost_per_side_pct: 0.0005     # 0.05% per side, for spread/slippage
  equity_curve_png: backtest_equity_curve.png

state:
  dir: state
  file: bot_state.json
