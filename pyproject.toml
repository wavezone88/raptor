[project]
name = "tradebot"
version = "0.1.0"
description = "Unattended rules-based US equity/ETF trading bot on Alpaca"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33",
    "pandas>=2.0",
    "numpy>=1.26",
    "vectorbt>=0.26",
    "plotly<6",          # vectorbt 1.1.0 uses scattermapbox, removed in plotly 6
    "apscheduler>=3.10",
    "pydantic-settings>=2.0",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tradebot = "tradebot.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
